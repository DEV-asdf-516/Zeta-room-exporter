<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zeta Room Exporter</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      color: #1e293b;
      font: 14px/1.45 system-ui, sans-serif;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    #exportButton {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 10px 12px;
      color: white;
      background: #2563eb;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #exportButton:disabled {
      cursor: wait;
      background: #94a3b8;
    }

    .format-picker {
      position: relative;
      flex: 1;
    }

    .format-trigger {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 36px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 7px 13px;
      color: #1e293b;
      background: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .format-trigger:hover,
    .format-trigger[aria-expanded="true"] {
      border-color: #60a5fa;
    }

    .format-arrow {
      width: 7px;
      height: 7px;
      margin-left: auto;
      margin-right: 3px;
      border-right: 2px solid #64748b;
      border-bottom: 2px solid #64748b;
      transform: rotate(45deg) translateY(-2px);
    }

    .format-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      left: 0;
      z-index: 1;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 8px 18px rgb(15 23 42 / 14%);
    }

    .format-menu[hidden] {
      display: none;
    }

    .format-option {
      display: block;
      width: 100%;
      border: 0;
      padding: 9px 13px;
      color: #1e293b;
      background: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .format-option:hover,
    .format-option[aria-selected="true"] {
      background: #eff6ff;
      color: #1d4ed8;
    }

    #status {
      min-height: 20px;
      margin: 10px 0 0;
      color: #475569;
      word-break: break-word;
    }

    #status.error {
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <h1>Zeta Room Exporter</h1>
  <label>저장 형식
    <span class="format-picker" id="formatPicker">
      <button class="format-trigger" id="formatTrigger" type="button" aria-expanded="false" aria-haspopup="listbox">
        <span id="formatLabel">JSON</span><span class="format-arrow" aria-hidden="true"></span>
      </button>
      <span class="format-menu" id="formatMenu" role="listbox" hidden>
        <button class="format-option" type="button" role="option" data-format="json" aria-selected="true">JSON</button>
        <button class="format-option" type="button" role="option" data-format="txt" aria-selected="false">TXT</button>
      </span>
    </span>
  </label>
  <button id="exportButton" type="button">현재 Room 내보내기</button>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>

</html>
